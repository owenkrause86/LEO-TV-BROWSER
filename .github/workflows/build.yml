name: Build LEO TV APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Build APK
        run: |
          chmod +x gradlew || echo "no gradlew"
          # Si no hay wrapper, usa gradle directo
          gradle assembleDebug || ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: LEO-TV-Browser-APK, path: app/build/outputs/apk/debug/*.apk }
